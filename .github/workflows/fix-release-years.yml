name: Fix Release Years (MusicBrainz first-release-date)

on:
  workflow_dispatch:  # Run manually from Actions tab — one-time fix

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6h ceiling; ~10,678 MBIDs at 1/sec ≈ 3h
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Restore MB cache (if any)
        # Allows resuming if the job is re-run after a partial failure
        uses: actions/cache@v4
        with:
          path: mb_first_release_cache.json
          key: mb-first-release-cache-${{ github.run_id }}
          restore-keys: mb-first-release-cache-

      - name: Run release year fix
        run: python3 fix_release_years.py

      - name: Commit results
        run: |
          git config user.email "action@github.com"
          git config user.name "MusicBrainz Release Year Bot"

          if git diff --quiet mb_first_release_cache.json explorer/public/songs.json 2>/dev/null; then
            echo "No changes"
            exit 0
          fi

          git add mb_first_release_cache.json explorer/public/songs.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Fix release years: use MusicBrainz first-release-date"
            git push
          fi
