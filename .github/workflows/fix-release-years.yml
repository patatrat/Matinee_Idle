name: Fix Release Years (MusicBrainz first-release-date)

on:
  workflow_dispatch:  # Run manually from Actions tab — one-time fix

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6h ceiling; ~10,678 MBIDs at 1/sec ≈ 3h
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run release year fix
        continue-on-error: true  # commit the cache even if apply phase fails
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 fix_release_years.py

      - name: Commit results
        run: |
          git config user.email "action@github.com"
          git config user.name "MusicBrainz Release Year Bot"

          git add mb_first_release_cache.json explorer/public/songs.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Fix release years: use MusicBrainz first-release-date"
            git push
          else
            echo "No changes to commit"
          fi
