name: Spotify Metadata Backfill

on:
  workflow_dispatch:        # Manual trigger only

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300    # 5 hour cap; script saves progress and exits cleanly on rate limit
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Backfill release_year and genre from Spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 enrich_spotify_metadata.py
        continue-on-error: true  # saves progress on rate limit, still commits

      - name: Commit and push updated files
        run: |
          git config user.email "action@github.com"
          git config user.name "Spotify Enrichment Bot"

          git add explorer/public/songs.json spotify_artist_genre_cache.json spotify_quota_reset.txt 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "chore: backfill release_year and genre from Spotify metadata"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit"
          fi
