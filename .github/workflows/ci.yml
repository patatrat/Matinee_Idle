name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only ever needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: explorer/package-lock.json

      # `npm ci` fails if package.json and package-lock.json have drifted,
      # which also guards against a hand-edited lockfile.
      - name: Install dependencies
        run: npm ci

      # `next build` runs tsc, so this catches type errors as well as build
      # breakage — the TypeScript 7 incompatibility in PR #11 failed here.
      - name: Build
        run: npm run build
