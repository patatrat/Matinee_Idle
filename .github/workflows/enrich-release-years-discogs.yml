name: Enrich Release Years (Discogs)

on:
  workflow_dispatch:  # Manual trigger — long-running (~4-8h depending on token)

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 600  # 10h ceiling
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Discogs release year enrichment
        continue-on-error: true  # Always reach the commit step, even on partial failure
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python3 enrich_release_years_discogs.py

      - name: Commit results
        run: |
          git config user.email "action@github.com"
          git config user.name "Discogs Release Year Bot"

          git add discogs_year_cache.json explorer/public/songs.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Enrich release years: Discogs master release data"
            git push
          else
            echo "No changes to commit"
          fi
