name: Dependabot auto-merge

# Queues Dependabot PRs for auto-merge so security fixes and routine bumps
# land without waiting on a human. GitHub only performs the merge once the
# required `build` check (ci.yml) passes on main's branch protection, so a
# broken update never merges. Semver-major bumps (version or security) are
# left for review.
on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0

      # Minor/patch only — this covers almost every security fix, which ship
      # as patch releases (e.g. next 16.4.0 -> 16.4.3).
      - name: Enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag major version bump for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: gh pr comment "$PR_URL" --body "Semver-major update — not auto-merged. Review the changelog and merge manually if CI passes."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
