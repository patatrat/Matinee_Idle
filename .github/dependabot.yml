version: 2
updates:
  - package-ecosystem: npm
    directory: /explorer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor/patch only, so a single breaking major can never block the safe bumps.
      # Majors arrive as their own PRs and are reviewed one at a time.
      all-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
