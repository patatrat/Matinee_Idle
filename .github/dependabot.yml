version: 2
updates:
  - package-ecosystem: npm
    directory: /explorer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor/patch only, so a single breaking major can never block the safe bumps.
      # Majors arrive as their own PRs and are reviewed one at a time.
      all-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Next.js 16.2 cannot use the TypeScript 7 compiler API — it fails the build with
      # "TypeScript 7.x does not provide the compiler API required by Next.js".
      # Drop this once Next supports TS7 (or experimental.useTypeScriptCli is adopted).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
